name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2
    with:
      otp-version: '28'
      rebar3-version: '3.27.0'
      enable-ex-doc: true
      enable-audit: true
      enable-sbom: true
      enable-sbom-scan: true
      enable-dependency-submission: true
      enable-elp-lint: true
      enable-elp-eqwalize: true
      enable-summary: true
